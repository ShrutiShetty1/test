<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shubh Labh Distributions</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Splash Screen -->
<div id="splash">

    <div class="logo-container">
        <img src="logo.png" class="logo" alt="Logo">
        <h1>SHUBH LABH DISTRIBUTIONS</h1>
    </div>

</div>

<!-- Intro Animation -->
<section id="intro">

<svg id="indiaSVG"
     viewBox="0 0 800 900"
     preserveAspectRatio="xMidYMid meet">

    <!-- Tricolor -->
    <g id="indiaFill">

        <rect id="saffron"
              x="0"
              y="0"
              width="800"
              height="300"
              fill="#FF9933"/>

        <rect id="white"
              x="0"
              y="300"
              width="800"
              height="300"
              fill="#FFFFFF"/>

        <rect id="green"
              x="0"
              y="600"
              width="800"
              height="300"
              fill="#138808"/>

    </g>

    <!-- Outline -->
    <path
        id="indiaPath"
        fill="none"
        stroke="#ff9933"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        d=""
    />

</svg>

<img
    src="truck.png"
    id="truck"
    alt="Truck">

</section>

<!-- Homepage -->
<div id="homepage">

    <!-- Paste your existing homepage here -->

</div>

<script src="script.js"></script>

</body>
</html>
